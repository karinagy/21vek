version: '3.8'

services:
  web:
    build:
      dockerfile: Dockerfile
      context: .
    volumes:
      - .:/app
    ports:
      - 8000:8000
    env_file: [ .env ]
    environment:
      - ENV_FILE=.env
    networks: [ web_network, redis_network ]

  redis:
    image: redis:7.0.8
    env_file: [ .env ]
    networks: [ redis_network ]
    ports:
      - "6375:6379"


networks:
  web_network:
  redis_network: